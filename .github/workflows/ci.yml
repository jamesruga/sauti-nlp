name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/python-3.11
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: pytest

      - name: Execute Benchmark & Update Visualizations
        run: |
          PYTHONPATH=src python scripts/update_benchmarks.py

      - name: Auto-commit Benchmark Updates
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add README.md benchmarks/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update benchmark metrics [skip ci]" && git push)
